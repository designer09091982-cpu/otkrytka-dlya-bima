<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Открытка из приюта</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet"><style id="css">
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#17110e;--ink:#f5ecdf;--muted:#cdbfae;--amber:#e3a65b;--panel:#231a15;--line:#3a2d25}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,"Segoe UI",system-ui,sans-serif}
.wrap{display:flex;flex-wrap:wrap;gap:32px;justify-content:center;align-items:flex-start;padding:24px 16px 48px}
.stage{display:flex;flex-direction:column;align-items:center;gap:14px;width:min(420px,100%)}
.card{position:relative;width:100%;aspect-ratio:9/16;border-radius:22px;overflow:hidden;
  background:radial-gradient(120% 80% at 50% 30%,#3a271b 0%,#1d1410 60%,#120c09 100%);
  box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.05);isolation:isolate;user-select:none}
.photo{position:absolute;inset:0;z-index:1;clip-path:circle(0% at 50% 42%);transition:clip-path 1.4s cubic-bezier(.7,0,.2,1)}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 30%;transform:scale(1.18)}
.photo img.happy{opacity:0;transition:opacity .55s ease}
.photo.smile img.happy{opacity:1}
.photo.smile img.base{opacity:0;transition:opacity .55s ease .15s}
.photo img.base{transition:opacity .55s ease}
.card.open .photo{clip-path:circle(80% at 50% 42%)}
.card.open .photo img{animation:kb 16s ease-out forwards}
@keyframes kb{from{transform:scale(1.18)}to{transform:scale(1.04) translateY(-2%)}}
.photo.pet img{animation:pet .7s ease-in-out !important}
@keyframes pet{0%{transform:scale(1.06)}35%{transform:scale(1.09) rotate(-1.4deg)}70%{transform:scale(1.07) rotate(1deg)}100%{transform:scale(1.06)}}
.shade{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity 1.2s .5s;
  background:linear-gradient(180deg,rgba(18,12,9,.35) 0%,rgba(18,12,9,0) 22%,rgba(18,12,9,0) 42%,rgba(18,12,9,.82) 70%,rgba(18,12,9,.97) 100%)}
.card.open .shade{opacity:1}
.glow{position:absolute;inset:-20%;z-index:2;pointer-events:none;mix-blend-mode:screen;opacity:0;transition:opacity 2s 1s;
  background:radial-gradient(40% 30% at 78% 12%,rgba(255,196,120,.45),transparent 70%)}
.card.open .glow{opacity:1;animation:sway 9s ease-in-out infinite alternate 2s}
@keyframes sway{to{transform:translate(-6%,4%)}}
canvas.fx{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
.top{position:absolute;top:18px;left:0;right:0;z-index:4;text-align:center;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);opacity:0;transition:opacity 1s 1s}
.card.open .top{opacity:.9}
.text{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:0 28px 26px;display:flex;flex-direction:column;gap:10px}
.name{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:clamp(40px,11vw,52px);line-height:1;margin:0}
.line{margin:0;font-size:15px;line-height:1.5;color:#eadfce}
.sign{margin:2px 0 0;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:19px;color:var(--amber)}
.rv{opacity:0;transform:translateY(14px);filter:blur(4px);transition:opacity .6s,transform .6s,filter .6s}
.card.open .rv{opacity:1;transform:none;filter:none;transition-duration:.9s}
.card.open .d1{transition-delay:1.3s}.card.open .d2{transition-delay:2s}.card.open .d3{transition-delay:2.7s}.card.open .d4{transition-delay:3.4s}.card.open .d5{transition-delay:4s}
.actions{display:flex;gap:10px;margin-top:8px;align-items:center}
.pet-btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid rgba(227,166,91,.6);
  background:rgba(227,166,91,.14);color:var(--ink);font:600 14px Manrope,sans-serif;cursor:pointer}
.pet-btn:hover{background:rgba(227,166,91,.26)}
.pet-btn svg{width:20px;height:20px}
.count{font-size:12px;color:var(--muted)}
.help{margin-left:auto;min-height:44px;display:inline-flex;align-items:center;padding:0 16px;border-radius:999px;background:var(--amber);color:#1b120c;font:700 14px Manrope,sans-serif;text-decoration:none}
.help:hover{background:#efb877}
.cover{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;padding:32px;
  background:radial-gradient(90% 60% at 50% 40%,#3b281c,#150e0b);transition:opacity 1s .3s,visibility 0s 1.3s}
.card.started .cover{opacity:0;visibility:hidden}
.seal{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#f0b76f,#b9772f 70%);
  box-shadow:0 0 0 6px rgba(227,166,91,.15),0 0 60px rgba(227,166,91,.35);animation:breathe 2.6s ease-in-out infinite}
.seal svg{width:54px;height:54px;color:#2a1a10}
@keyframes breathe{50%{transform:scale(1.06);box-shadow:0 0 0 12px rgba(227,166,91,.08),0 0 90px rgba(227,166,91,.5)}}
.cover h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:34px;line-height:1.1;margin:0;text-wrap:balance}
.cover p{margin:0;color:var(--muted);font-size:14px}
.open-btn{min-height:48px;padding:0 28px;border-radius:999px;border:0;background:var(--ink);color:#1b120c;font:700 15px Manrope,sans-serif;cursor:pointer}
.nav{display:none;align-items:center;gap:12px;width:100%}
.nav.on{display:flex}
.navbtn{min-height:44px;min-width:44px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:600 14px Manrope,sans-serif;cursor:pointer;padding:0 16px}
.navbtn:hover{border-color:var(--amber)}
.navbtn.next{margin-left:auto}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots span{width:7px;height:7px;border-radius:50%;background:#5a4638}
.dots span.on{background:var(--amber)}
.panel{display:none;width:min(380px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;flex-direction:column;gap:14px}
.panel.on{display:flex}
.panel h2{margin:0;font-family:"Cormorant Garamond",Georgia,serif;font-size:26px;font-weight:600}
.hint{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
.sec{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber);margin-top:6px}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumb{position:relative;width:64px;height:64px;border-radius:12px;overflow:hidden;border:2px solid transparent;padding:0;background:#1a130f;cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.on{border-color:var(--amber)}
.add{display:grid;place-items:center;width:64px;height:64px;border-radius:12px;border:1px dashed #6a5343;color:var(--ink);font-size:26px;cursor:pointer}
.add:hover{border-color:var(--amber)}
.add input,.file input{position:absolute;width:1px;height:1px;opacity:0}
.f{display:flex;flex-direction:column;gap:6px}
.f label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.f input,.f textarea{width:100%;background:#1a130f;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:15px Manrope,sans-serif}
.f textarea{resize:vertical}
.f input:focus,.f textarea:focus{outline:2px solid var(--amber);outline-offset:1px}
.row{display:flex;gap:10px}
.btn,.file{flex:1;min-height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;border:1px solid var(--line);background:#2d221c;color:var(--ink);font:600 14px Manrope,sans-serif;cursor:pointer;position:relative}
.btn:hover,.file:hover{border-color:var(--amber)}
.btn.primary{background:var(--amber);color:#1b120c;border-color:var(--amber)}
.btn.danger{color:#f0a18c}
.hrow{display:flex;gap:10px;align-items:center}
.hprev{width:44px;height:44px;border-radius:10px;object-fit:cover;background:#1a130f;flex:none}
.hprev[hidden]{display:none}
.btn:disabled{opacity:.5;cursor:default}
.status{min-height:18px;font-size:13px;color:var(--muted)}
.status.ok{color:#a9d39a}.status.err{color:#f0a18c}
@media (prefers-reduced-motion:reduce){.card.open .photo img,.card.open .glow,.seal{animation:none}}
</style></head>
<body>
<template id="markup">
<div class="wrap">
  <div class="stage">
    <div class="card" id="card">
      <div class="photo" id="photo"><img id="img" class="base" alt=""><img id="img2" class="happy" alt="" hidden=""></div>
      <div class="glow"></div>
      <div class="shade"></div>
      <canvas class="fx" id="fx"></canvas>
      <div class="top" id="tShelter"></div>
      <div class="text">
        <p class="line rv d1" id="tHello"></p>
        <h2 class="name rv d2" id="tName"></h2>
        <p class="line rv d3" id="tMsg"></p>
        <p class="sign rv d4" id="tSign"></p>
        <div class="actions rv d5">
          <button class="pet-btn" id="petBtn" type="button">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><ellipse cx="6" cy="9" rx="2.1" ry="2.7"></ellipse><ellipse cx="10" cy="5.6" rx="2.1" ry="2.7"></ellipse><ellipse cx="14.4" cy="5.6" rx="2.1" ry="2.7"></ellipse><ellipse cx="18.3" cy="9" rx="2.1" ry="2.7"></ellipse><path d="M12.2 11.2c-3 0-6 3.6-6 6.3 0 1.9 1.5 2.7 3.1 2.7 1.3 0 2-.6 2.9-.6s1.6.6 2.9.6c1.6 0 3.1-.8 3.1-2.7 0-2.7-3-6.3-6-6.3z"></path></svg>
            Погладить
          </button>
          <span class="count" id="count"></span>
          <a class="help" id="helpLink" href="#" target="_blank" rel="noopener">Помочь</a>
        </div>
      </div>
      <div class="cover">
        <div class="seal"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.3C1 8.5 3 5 6.5 5c2.1 0 3.6 1.2 4.5 2.6C11.9 6.2 13.4 5 15.5 5 19 5 21 8.5 19.6 11.7 17.5 16.4 12 21 12 21z"></path></svg></div>
        <h1>Тебе открытка от&nbsp;пушистого друга</h1>
        <p>Нажми, чтобы открыть</p>
        <button class="open-btn" id="openBtn" type="button">Открыть</button>
      </div>
    </div>
    <div class="nav" id="nav">
      <button class="navbtn" id="prev" type="button" aria-label="Предыдущий питомец">←</button>
      <div class="dots" id="dots"></div>
      <button class="navbtn next" id="next" type="button">Следующий друг →</button>
    </div>
  </div>

  <aside class="panel" id="panel" aria-label="Управление питомцами">
    <h2>Питомцы на открытке</h2>
    <p class="hint">Эту панель видите только вы. Добавьте фото, поправьте текст и нажмите «Сохранить для всех»: изменения появятся по той же ссылке.</p>
    <div class="sec">Питомцы</div>
    <div class="thumbs" id="thumbs"></div>
    <div class="sec">Выбранный питомец</div>
    <label class="file">Заменить фото<input type="file" id="fReplace" accept="image/*"></label>
    <div class="f"><label>Фото «улыбка» для кнопки «Погладить»</label>
      <div class="hrow"><img class="hprev" id="hPrev" alt="" hidden=""><label class="file">Загрузить улыбку<input type="file" id="fHappy" accept="image/*"></label><button class="btn" id="hDel" type="button" style="flex:none;padding:0 14px">Убрать</button></div>
      <p class="hint">Тот же питомец, тот же ракурс, но довольный: пасть приоткрыта, язык. Можно без него, тогда питомец просто кивнёт.</p></div>
    <div class="f"><label for="fName">Имя</label><input id="fName"></div>
    <div class="f"><label for="fHello">Приветствие</label><input id="fHello"></div>
    <div class="f"><label for="fMsg">Текст</label><textarea id="fMsg" rows="3"></textarea></div>
    <div class="f"><label for="fSign">Подпись</label><input id="fSign"></div>
    <button class="btn danger" id="del" type="button">Удалить этого питомца</button>
    <div class="sec">Общее</div>
    <div class="f"><label for="fShelter">Название приюта</label><input id="fShelter"></div>
    <div class="f"><label for="fLink">Ссылка на пожертвование</label><input id="fLink" placeholder="https://…"></div>
    <button class="btn primary" id="save" type="button">Сохранить для всех</button>
    <div class="status" id="status" role="status"></div>
  </aside>
</div>
</template>

<script id="app">
(function(){
  var HEAD='<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Открытка из приюта<\/title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">';
  var tpl=document.getElementById('markup');
  var CSS=document.getElementById('css').textContent, TPL=tpl.innerHTML, APP=document.getElementById('app').textContent;
  var data=JSON.parse(document.getElementById('data').textContent);
  document.body.appendChild(tpl.content.cloneNode(true));
  var $=function(id){return document.getElementById(id)};
  var card=$('card'), fx=$('fx'), ctx=fx.getContext('2d');
  var cur=Math.floor(Math.random()*Math.max(1,data.pets.length)), pets=0, editing=false, dirty=false;

  /* ---- particles ---- */
  var W=0,H=0,dpr=Math.min(window.devicePixelRatio||1,2);
  function size(){var r=card.getBoundingClientRect();W=r.width;H=r.height;fx.width=W*dpr;fx.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
  size();window.addEventListener('resize',size);
  var dust=[];for(var i=0;i<34;i++)dust.push({x:Math.random(),y:Math.random(),r:1+Math.random()*3.2,s:.00012+Math.random()*.0004,a:.15+Math.random()*.45,p:Math.random()*6.28});
  var hearts=[];
  function heart(x,y,s){ctx.beginPath();ctx.moveTo(x,y+s*.3);ctx.bezierCurveTo(x,y,x-s*.5,y,x-s*.5,y+s*.3);ctx.bezierCurveTo(x-s*.5,y+s*.6,x,y+s*.8,x,y+s);ctx.bezierCurveTo(x,y+s*.8,x+s*.5,y+s*.6,x+s*.5,y+s*.3);ctx.bezierCurveTo(x+s*.5,y,x,y,x,y+s*.3)}
  var t0=performance.now();
  function frame(t){var dt=Math.min(t-t0,50);t0=t;ctx.clearRect(0,0,W,H);
    for(var i=0;i<dust.length;i++){var d=dust[i];d.y-=d.s*dt;d.p+=.001*dt;if(d.y<-.05){d.y=1.05;d.x=Math.random()}
      ctx.beginPath();ctx.arc((d.x+Math.sin(d.p)*.02)*W,d.y*H,d.r,0,6.28);ctx.fillStyle='rgba(255,205,140,'+d.a+')';ctx.shadowColor='rgba(255,190,110,.9)';ctx.shadowBlur=8;ctx.fill()}
    ctx.shadowBlur=0;hearts=hearts.filter(function(h){return h.life>0});
    hearts.forEach(function(h){h.vy+=.00018*dt;h.x+=h.vx*dt;h.y+=h.vy*dt;h.life-=dt;h.rot+=h.vr*dt;
      ctx.save();ctx.translate(h.x,h.y);ctx.rotate(h.rot);ctx.globalAlpha=Math.min(1,h.life/500);heart(0,-h.s/2,h.s);ctx.fillStyle=h.c;ctx.fill();ctx.restore()});
    ctx.globalAlpha=1;requestAnimationFrame(frame)}
  requestAnimationFrame(frame);
  function burst(x,y,n){var c=['#e3a65b','#f5ecdf','#ef8b6b','#f3c98b'];for(var i=0;i<n;i++){var a=-Math.PI/2+(Math.random()-.5)*1.9,sp=.12+Math.random()*.28;
    hearts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,s:10+Math.random()*16,life:1400+Math.random()*900,rot:Math.random()-.5,vr:(Math.random()-.5)*.004,c:c[i%4]})}}

  /* ---- render ---- */
  function fill(){var p=data.pets[cur];if(!p)return;
    $('img').src=p.img;var h=$('img2');$('photo').classList.remove('smile');if(p.happy){h.src=p.happy;h.hidden=false}else{h.hidden=true;h.removeAttribute('src')}$('img').alt=p.name||'Питомец';$('tName').textContent=p.name||'';$('tHello').textContent=p.hello||'';
    $('tMsg').textContent=p.msg||'';$('tSign').textContent=p.sign||'';$('tShelter').textContent=data.shelter||'';
    $('helpLink').href=data.link||'#';$('count').textContent='';pets=0;
    var dots=$('dots');dots.textContent='';data.pets.forEach(function(_,i){var s=document.createElement('span');if(i===cur)s.className='on';dots.appendChild(s)});
    $('nav').classList.toggle('on',card.classList.contains('started')&&data.pets.length>1);
    if(editing)fillForm();}
  function reveal(){card.classList.add('open');setTimeout(function(){burst(W/2,H*.42,26)},800)}
  function go(i){if(!data.pets.length)return;cur=(i+data.pets.length)%data.pets.length;card.classList.remove('open');hearts=[];
    setTimeout(function(){fill();requestAnimationFrame(function(){requestAnimationFrame(reveal)})},650)}
  $('openBtn').onclick=function(){card.classList.add('started');$('nav').classList.toggle('on',data.pets.length>1);reveal()};
  $('next').onclick=function(){go(cur+1)};$('prev').onclick=function(){go(cur-1)};
  var smileT=null;
  $('petBtn').onclick=function(){pets++;var pd=data.pets[cur]||{};var p=$('photo');$('count').textContent=pets===1?(pd.happy?'Улыбается!':'Хвост виляет!'):'× '+pets;
    p.classList.remove('pet');void p.offsetWidth;p.classList.add('pet');burst(W/2,H*.4,pd.happy?20:14);
    if(pd.happy){p.classList.add('smile');clearTimeout(smileT);smileT=setTimeout(function(){p.classList.remove('smile')},2800)}};
  card.addEventListener('click',function(e){if(!card.classList.contains('open')||e.target.closest('button,a'))return;var r=card.getBoundingClientRect();burst(e.clientX-r.left,e.clientY-r.top,8)});
  fill();

  /* ---- owner editor ---- */
  function status(t,k){var s=$('status');s.textContent=t;s.className='status'+(k?' '+k:'')}
  function thumbs(){var box=$('thumbs');box.textContent='';
    data.pets.forEach(function(p,i){var b=document.createElement('button');b.type='button';b.className='thumb'+(i===cur?' on':'');b.setAttribute('aria-label',p.name||('Питомец '+(i+1)));
      var im=document.createElement('img');im.src=p.img;im.alt='';b.appendChild(im);b.onclick=function(){cur=i;fill();card.classList.add('started');card.classList.remove('open');setTimeout(reveal,50)};box.appendChild(b)});
    var add=document.createElement('label');add.className='add';add.title='Добавить питомца';add.textContent='+';
    var inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.setAttribute('aria-label','Добавить питомца');add.appendChild(inp);
    inp.onchange=function(){var f=inp.files[0];if(!f)return;shrink(f,function(src){data.pets.push({id:'p'+Date.now(),name:'Имя',hello:'Привет! Меня зовут',msg:'Я жду свою семью в приюте. Спасибо, что помогаешь мне.',sign:'Спасибо, что ты рядом',img:src});
      cur=data.pets.length-1;mark();card.classList.add('started');go(cur)})};box.appendChild(add)}
  function fillForm(){var p=data.pets[cur]||{};$('fName').value=p.name||'';$('fHello').value=p.hello||'';$('fMsg').value=p.msg||'';$('fSign').value=p.sign||'';
    $('fShelter').value=data.shelter||'';$('fLink').value=data.link||'';$('del').disabled=data.pets.length<2;var hp=$('hPrev');if(p.happy){hp.src=p.happy;hp.hidden=false}else{hp.hidden=true;hp.removeAttribute('src')}$('hDel').disabled=!p.happy;thumbs()}
  function mark(){dirty=true;status('Есть несохранённые изменения')}
  function shrink(file,cb){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var m=720,s=Math.min(1,m/Math.max(im.width,im.height)),
    c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.82))};im.src=r.result};r.readAsDataURL(file)}
  [['fName','name','tName'],['fHello','hello','tHello'],['fMsg','msg','tMsg'],['fSign','sign','tSign']].forEach(function(a){
    $(a[0]).addEventListener('input',function(e){var p=data.pets[cur];if(!p)return;p[a[1]]=e.target.value;$(a[2]).textContent=e.target.value;mark();if(a[1]==='name')thumbs()})});
  $('fShelter').addEventListener('input',function(e){data.shelter=e.target.value;$('tShelter').textContent=e.target.value;mark()});
  $('fLink').addEventListener('input',function(e){data.link=e.target.value.trim();$('helpLink').href=data.link||'#';mark()});
  $('fReplace').addEventListener('change',function(e){var f=e.target.files[0];if(!f)return;shrink(f,function(src){data.pets[cur].img=src;mark();go(cur)})});
  $('fHappy').addEventListener('change',function(e){var f=e.target.files[0];if(!f)return;shrink(f,function(src){data.pets[cur].happy=src;mark();fill();$('petBtn').click()});e.target.value=''});
  $('hDel').onclick=function(){delete data.pets[cur].happy;mark();fill()};
  $('del').onclick=function(){if(data.pets.length<2)return;if(!confirm('Удалить «'+(data.pets[cur].name||'питомца')+'»?'))return;data.pets.splice(cur,1);cur=Math.min(cur,data.pets.length-1);mark();go(cur)};
  window.addEventListener('beforeunload',function(e){if(dirty){e.preventDefault();e.returnValue=''}});

  function buildDoc(){var json=JSON.stringify(data).replace(/</g,'\\u003c');
    return '<!doctype html>\n<html lang="ru">\n<head>'+HEAD+'<style id="css">'+CSS+'<\/style><\/head>\n<body>\n<template id="markup">'+TPL+'<\/template>\n<script type="application/json" id="data">'+json+'<\/script>\n<script id="app">'+APP+'<\/script>\n<\/body>\n<\/html>'}

  var art=null;
  $('save').onclick=function(){if(!art)return;var b=$('save');b.disabled=true;status('Сохраняю…');
    art.publish(buildDoc()).then(function(){dirty=false;status('Сохранено. Ссылка уже показывает новую версию.','ok')})
    .catch(function(err){b.disabled=false;var c=err&&err.code;
      if(c==='conflict'){dirty=false;status('Страницу обновили в другом окне, загружаю свежую версию.')}
      else if(c==='not_writer'||c==='not_granted'){status('У вас нет прав на изменение этой открытки.','err')}
      else if(c==='too_large'){status('Слишком много фото. Удалите пару питомцев и попробуйте снова.','err')}
      else if(c==='rate_limited'){status('Слишком часто. Подождите минуту и сохраните снова.','err')}
      else{status('Не удалось сохранить. Попробуйте ещё раз.','err')}})};

  if(window.claude&&window.claude.use){
    Promise.all([window.claude.use('artifact'),window.claude.use('user')]).then(function(r){art=r[0];var u=r[1];
      if(!art||!u)return;return u.canEdit().then(function(ok){if(!ok)return;editing=true;$('panel').classList.add('on');fillForm()})}).catch(function(){});
  }
})();
</script>
</body>
</html>
